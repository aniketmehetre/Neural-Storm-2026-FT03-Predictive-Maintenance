version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rul-api
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - LLM_PROVIDER=offline
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: rul-dashboard
    ports:
      - "8501:8080"
    environment:
      - PORT=8080
      - LLM_PROVIDER=offline
    depends_on:
      - api
    restart: unless-stopped
