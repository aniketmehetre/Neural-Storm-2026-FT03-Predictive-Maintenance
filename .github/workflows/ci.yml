name: CI

on:
  push:
    branches: [ main, winning-upgrade ]
  pull_request:
    branches: [ main, winning-upgrade ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.txt

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Run Benchmark Quick Smoke Test
      run: |
        python -m src.benchmark --quick

    - name: Run Decision Backtest Smoke Test
      run: |
        python -m src.decision.backtest

    - name: Verify Audit Ledger Cryptographic Integrity
      run: |
        python -m src.audit --verify
