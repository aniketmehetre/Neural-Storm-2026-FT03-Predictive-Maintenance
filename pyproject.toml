[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance"
version = "2.0.0"
description = "RUL prediction & anomaly detection system for industrial engines (NASA CMAPSS)"
authors = [
    {name = "Aniket Mehetre", email = "aniketprof23@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
